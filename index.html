<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e9eee7"><title>みつやと綴る、やさしいタイピング</title><style>
:root{--bg:#edf0ea;--ink:#354a46;--muted:#73837e;--sage:#7b9c89;--line:#d6e0d7;--card:#fffefa;--pink:#cba7ae}*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 12% 2%,#fffaf3 0,transparent 38%),linear-gradient(150deg,#e6ede7,#f3efe9 67%,#e8edeb);min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #6b987d;outline-offset:3px}.app{max-width:980px;margin:auto;min-height:100vh;padding:24px 18px 45px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#587569;font-size:12px;letter-spacing:.15em}.brand .sub{letter-spacing:0;color:#87958b}.panel{background:#ffffffc9;backdrop-filter:blur(16px);border:1px solid #fff;box-shadow:0 16px 55px #63796819;border-radius:28px;overflow:hidden;margin-top:18px}.scene{min-height:490px;position:relative;display:grid;grid-template-columns: 43% 57%;background:linear-gradient(135deg,#eef3e8,#faf6ee)}.portrait{position:relative;min-height:360px;overflow:hidden;background:radial-gradient(circle at 45% 23%,#fefbf0 0%,#f3f3e9 32%,#dae7dd 90%);display:flex;align-items:center;justify-content:center}.portrait:before{content:"";position:absolute;width:320px;height:320px;border:1px solid #ffffffa8;border-radius:50%;top:48px;left:calc(50% - 160px)}.portrait svg{width:min(92%,370px);max-height:380px;position:relative;filter:drop-shadow(0 13px 16px #557c7030)}.leaf{position:absolute;color:#9fb8a3;font-size:48px;opacity:.3}.l1{left:13px;top:33px;transform:rotate(-22deg)}.l2{right:15px;bottom:12px;transform:rotate(42deg)}.content{padding:36px 34px;display:flex;flex-direction:column;justify-content:center;gap:17px}.eyebrow{color:#7c9e87;letter-spacing:.15em;font-size:12px}.content h1{font-family:serif;font-weight:500;font-size:clamp(25px,3.5vw,38px);line-height:1.5;letter-spacing:.06em;margin:0}.copy{line-height:2.1;color:#5f746c;font-size:14px}.speech{font-family:serif;line-height:1.95;white-space:pre-line;font-size:clamp(19px,2.7vw,25px);margin:4px 0;color:#4c6059}.btn{border:0;border-radius:999px;padding:14px 24px;background:#789a87;color:white;letter-spacing:.07em;font-weight:600;box-shadow:0 7px 20px #819c8b30;transition:.2s}.btn:hover{transform:translateY(-2px);background:#688c78}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.secondary{background:transparent;color:#688a79;box-shadow:none;border:1px solid #a7c3ae}.secondary:hover{background:#f0f6f0}.choice{border:1px solid #d8e4d9;background:#fffffff0;text-align:left;padding:14px 17px;border-radius:15px;color:#4f665a;line-height:1.6;transition:.2s;width:100%}.choice:hover{border-color:#80a892;background:#f3faf4;transform:translateX(3px)}.choices{display:grid;gap:10px}.choice small{color:#9aae9e;margin-right:10px}.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:#85948d}.dots{display:flex;gap:6px}.dot{width:20px;height:5px;border-radius:8px;background:#dae2d9}.dot.on{background:#8ead96}.typearea{border-radius:18px;padding:19px 20px;background:#fffefc;border:1px solid var(--line)}.target{line-height:1.8;font-size:17px;color:#455e52}.reading{color:#879991;font-size:12px;margin-top:5px}.romaji{font:16px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;margin-top:10px;letter-spacing:.03em}.romaji .done{color:#69a588}.romaji .todo{color:#899a91}.romaji .next{background:#daeadc;color:#375d43;border-radius:3px}.typeinput{margin-top:13px;width:100%;border:1px solid #c8d9cd;background:#f8fbf7;border-radius:10px;padding:13px 14px;color:#3c5b4d;font-size:16px}.hint{color:#91a199;font-size:12px;line-height:1.8}.feedback{min-height:22px;color:#bb7c7e;font-size:13px}.footer{margin:16px auto;max-width:850px;text-align:center;color:#91a098;font-size:11px;line-height:2}.gauge{display:flex;gap:15px;flex-wrap:wrap}.meter{flex:1;min-width:96px;font-size:11px;color:#738a7d}.track{margin-top:7px;height:6px;border-radius:20px;background:#e2eae2;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#aecaba,#719e83);transition:width .35s}.result-art{border-radius:20px;overflow:hidden;background:linear-gradient(140deg,#e4eee6,#f7f2e9);border:1px solid #e0e8db}.result-art svg{display:block;width:100%;height:auto}.mini{font-size:12px;color:#8ca095}.results{display:grid;gap:12px}.result-actions{display:flex;gap:10px;flex-wrap:wrap}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.tile{border:1px solid #dde6dc;border-radius:15px;background:#ffffffb8;padding:11px;text-align:center}.tile svg{width:100%;display:block;border-radius:10px}.locked{filter:grayscale(1) blur(6px);opacity:.35}.tile-title{font-size:12px;margin-top:9px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:690px){.app{padding:15px 11px 32px}.scene{display:flex;flex-direction:column}.portrait{min-height:215px;max-height:235px}.portrait svg{height:240px;width:auto}.content{padding:24px 20px;gap:14px}.content h1{font-size:26px}.speech{font-size:21px}.panel{border-radius:22px}.brand .sub{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="app"><header class="brand"><span>✳ MITSUYA INNER WORLD</span><span class="sub">言葉の温度を、ひとつずつ。</span></header><main class="panel"><div id="screen" class="scene"></div></main><footer class="footer">このゲームはフィクションです。選択による結末は性格診断やあなた自身の価値の評価ではありません。<br>進行状況はこのブラウザにのみ保存されます。画面の大きさに合わせて遊べます。</footer></div><script>
'use strict';
const KEY='mitsuya-typing-v1';
const endings={
 dawn:{name:'夜明けの約束',subtitle:'特別な言葉が届いた日',msg:'「うまく言えない日があっても。…また、ここで話そう。」',colors:['#dcebdc','#ffecce','#a8cbb0'],symbol:'✧'},
 resonance:{name:'星を分けあう夜',subtitle:'同じ景色の、違う見え方',msg:'「違う考え方なのに、なんだか安心する。不思議だね。」',colors:['#243c51','#597780','#acc9b7'],symbol:'✦'},
 shelter:{name:'雨音の居場所',subtitle:'沈黙も会話になる',msg:'「返事を急がなくていいって、ここで覚えた気がする。」',colors:['#8aa9a1','#d9e6df','#d8cfba'],symbol:'☂'},
 normal:{name:'また会うための余白',subtitle:'まだ知らない言葉がある',msg:'「今日の続きは、いつか。来てくれてありがとう。」',colors:['#a8c1aa','#f4efe0','#a6b9a9'],symbol:'❋'},
 bad:{name:'閉じたままの窓',subtitle:'言葉が届かない夜',msg:'「今日は、少しだけ一人にして。…でも、君が悪いわけじゃないよ。」',colors:['#536473','#aab8bd','#687783'],symbol:'☾'}
};
const scenes=[
 {m:'……来てくれたんだ。\nここ、初めてだよね。',opts:[['うん。ゆっくり話せたらうれしい','unn. yukkuri hanasetara uresii',[2,2,1]],['どんな場所なのか、気になって','donna basyo nanoka, kini natte',[1,0,2]],['とりあえず、来てみただけ','toriaezu, kitemita dake',[0,-1,0]]]},
 {m:'今日は、なんだか考えすぎちゃって。\n何もなかったはずなのに。',opts:[['何もなくても疲れる日、あるよね','nanimo nakutemo tukareru hi, aruyone',[1,2,2]],['考えたことを聞いてもいい？','kangaeta koto wo kiitemo ii?', [2,0,2]],['気にしすぎじゃない？','kinisi sugi janai?',[-2,-2,-1]]]},
 {m:'誰かの言葉が、ずっと残ることがある。\n君にも、そういうことある？',opts:[['あるよ。言葉って残るよね','aruyo. kotoba tte nokoruyone',[1,1,2]],['どんな言葉だった？','donna kotoba datta?', [2,0,1]],['忘れたほうが楽だよ','wasureta hou ga raku dayo',[-1,-2,-1]]]},
 {m:'僕って、面倒な人なのかな。\nたまに、そんなふうに思う。',opts:[['面倒かどうかは、一言じゃ決められない','mendouka douka wa, hitokoto ja kimerarenai',[1,2,2]],['自分を責めてしまう日もあるね','jibun wo semete simau hi mo arune',[1,2,1]],['そんなこと考えても仕方ないよ','sonna koto kangaetemo sikatanaiyo',[-2,-2,-2]]]},
 {m:'少し黙っていても、いい？\n言葉を探してる。',opts:[['もちろん。ここにいるよ','motiron. koko ni iruyo',[1,3,1]],['待ってる。急がなくていい','matteru. isoganakute ii',[1,3,0]],['早く話してほしいな','hayaku hanasite hosiina',[-2,-3,-1]]]},
 {m:'不思議だね。\nさっきより、少し呼吸が軽い。',opts:[['それなら、よかった','sorenara, yokatta',[1,2,0]],['言葉にできると変わるのかもね','kotoba ni dekiruto kawarunokamone',[1,0,3]],['僕のおかげ、ってこと？','boku no okage, tte koto?',[-1,-1,-2]]]},
 {m:'もし、明日も今日みたいな日だったら。\n君なら、どうする？',opts:[['明日の自分にできることをひとつだけ','asita no jibun ni dekiru koto wo hitotu dake',[1,2,2]],['違う景色を見に行くかも','tigau kesiki wo mi ni iku kamo',[1,0,3]],['考えるのをやめるべきだよ','kangaeru nowo yameru beki dayo',[-2,-2,-1]]]},
 {m:'そろそろ、夜が明けるね。\n最後に、何か言ってくれる？',opts:[['また来るよ。続きを話そう','mata kuruyo. tuduki wo hanasou',[3,2,1]],['今日の時間、覚えていたい','kyou no jikan, oboete itai',[1,1,3]],['もう話すこと、ないかな','mou hanasu koto, naikana',[-3,-2,-2]]]}
];
const screen=document.querySelector('#screen');
let state={page:'home',index:0,stats:[0,0,0],choice:null,typed:'',mistakes:0,correct:0,started:0,elapsed:0,last:null};
let progress=load();function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return {unlocked:Array.isArray(x.unlocked)?x.unlocked:[],best:x.best||0,plays:x.plays||0,settings:x.settings||{}}}catch{return {unlocked:[],best:0,plays:0,settings:{}}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch{}}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function portrait(){return `<div class="portrait" aria-label="宿木みつやのイメージ"><span class="leaf l1">❧</span><span class="leaf l2">❧</span><svg viewBox="0 0 360 400" role="img" aria-label="銀白色のショートヘア、緑の目、セージグリーンのベストを着たみつや"><defs><linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#b8c8c6"/></linearGradient><linearGradient id="vest" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#9ab5a2"/><stop offset="1" stop-color="#658c7a"/></linearGradient></defs><ellipse cx="180" cy="376" rx="126" ry="19" fill="#789b8a" opacity=".12"/><path d="M75 387 Q75 294 128 280 L230 279 Q288 294 293 387Z" fill="#faf8ef"/><path d="M120 285 L164 320 L179 388 L89 388 Q90 301 120 285M240 285 L196 320 L181 388 L270 388 Q269 301 240 285" fill="url(#vest)"/><path d="M151 274 L155 303 L181 325 L208 300 L207 274Z" fill="#f2dcd1"/><path d="M151 288 L180 331 L208 287 L205 326 L183 345 L155 326Z" fill="#fffdf8"/><path d="M117 135 Q118 74 182 75 Q248 74 245 141 L234 235 Q222 278 181 287 Q139 274 126 230Z" fill="#f3ded3" stroke="#e2cfc6" stroke-width="2"/><path d="M120 196 Q94 142 119 98 Q144 50 197 65 Q263 58 257 135 L243 203 L232 153 L217 129 Q169 162 118 149Z" fill="url(#hair)"/><path d="M112 139 Q135 83 190 83 Q227 79 254 116 Q221 111 202 97 Q172 145 109 161Z" fill="url(#hair)"/><path d="M113 163 Q138 126 160 111 M220 111 Q246 138 248 169" fill="none" stroke="#d6e0dd" stroke-width="17" stroke-linecap="round"/><path d="M137 197 Q156 186 172 197 M192 197 Q209 186 226 197" stroke="#89988e" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="155" cy="201" rx="8" ry="11" fill="#629a90"/><ellipse cx="210" cy="201" rx="8" ry="11" fill="#629a90"/><circle cx="158" cy="197" r="3" fill="#fff"/><circle cx="213" cy="197" r="3" fill="#fff"/><path d="M183 209 L180 225 L185 226" stroke="#d7b6ac" stroke-width="2" fill="none"/><path d="M170 243 Q182 250 195 242" stroke="#c58f90" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M114 146 Q122 81 180 76 Q235 72 250 122" stroke="#f5f8f3" stroke-width="9" stroke-linecap="round" fill="none" opacity=".8"/></svg></div>`}
function dots(){return `<div class="dots">${scenes.map((_,i)=>`<span class="dot ${i<=state.index?'on':''}"></span>`).join('')}</div>`}
function meters(){return `<div class="gauge">${['親密度','安心度','共鳴度'].map((n,i)=>`<div class="meter">${n}<div class="track"><div class="fill" style="width:${Math.max(5,Math.min(100,50+state.stats[i]*2.3))}%"></div></div></div>`).join('')}</div>`}
function render(){let body='';if(state.page==='home'){body=`<span class="eyebrow">A QUIET TYPING STORY</span><h1>みつやと綴る、<br>やさしいタイピング</h1><p class="copy">言葉を選び、一文字ずつ届ける。<br>その返事で、ふたりの夜が少しずつ変わっていく。<br>8つの会話の先に、あなたが綴った結末が待っています。</p><button class="btn" id="start">言葉を綴りはじめる　→</button><button class="btn secondary" id="gallery">思い出のギャラリー（${progress.unlocked.length}/5）</button><p class="mini">PCのキーボード推奨・ローマ字入力／制限時間なし／無料</p>`}
else if(state.page==='choose'){let s=scenes[state.index];body=`<div class="stats"><span>ことば ${state.index+1} / ${scenes.length}</span>${dots()}</div><div class="eyebrow">MITSUYA SAYS</div><p class="speech">${escapeHTML(s.m)}</p><p class="hint">あなたなら、どんな言葉を返す？　ひとつ選んで、実際に打ってみよう。</p><div class="choices">${s.opts.map((o,i)=>`<button class="choice" data-choice="${i}"><small>0${i+1}</small>${escapeHTML(o[0])}</button>`).join('')}</div>${meters()}`}
else if(state.page==='type'){const o=scenes[state.index].opts[state.choice];let t=o[1];let n=state.typed.length;body=`<div class="stats"><span>ことば ${state.index+1} / ${scenes.length}</span>${dots()}</div><div class="eyebrow">YOUR WORDS</div><p class="speech">その言葉を、みつやへ。</p><div class="typearea"><div class="target">${escapeHTML(o[0])}</div><div class="reading">選んだ文章をローマ字で入力してください</div><div class="romaji"><span class="done">${escapeHTML(t.slice(0,n))}</span><span class="next">${escapeHTML(t.slice(n,n+1))}</span><span class="todo">${escapeHTML(t.slice(n+1))}</span></div><input id="typeInput" class="typeinput" type="text" inputmode="latin" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="ここにローマ字を打ってね" aria-label="タイピング入力" value="${escapeHTML(state.typed)}"><div class="feedback" id="feedback" aria-live="polite"></div></div><p class="hint">表示のローマ字をそのまま入力（空白・句読点も含む）。ゆっくりで大丈夫。間違えた文字は入力されません。</p><button class="btn secondary" id="back">返答を選びなおす</button>`}
else if(state.page==='reply'){let o=scenes[state.index].opts[state.choice],r=replyFor(o[2],state.index);body=`<div class="stats"><span>ことば ${state.index+1} / ${scenes.length}</span>${dots()}</div><div class="eyebrow">A LETTER RECEIVED</div><p class="speech">${escapeHTML(r)}</p><p class="copy">あなたの言葉が、みつやに届きました。</p>${meters()}<button class="btn" id="next">${state.index===scenes.length-1?'結末を見る':'次の言葉へ'}　→</button>`}
else if(state.page==='result'){const e=endings[state.last];body=`<div class="eyebrow">ENDING · ${state.last==='bad'?'SHADOW':'MEMORY'}</div><h1>${e.name}</h1><p class="copy">${e.subtitle}</p><div class="result-art" id="art">${rewardSvg(state.last)}</div><p class="speech" style="font-size:19px">${e.msg}</p><div class="results"><div class="mini">タイピング成功 ${state.correct}文字 ／ 入力ミス ${state.mistakes}回　・　到達エンディング ${progress.unlocked.length}/5</div>${meters()}</div><div class="result-actions"><button class="btn" id="restart">もう一度、話す</button><button class="btn secondary" id="download">特別画像を保存</button><button class="btn secondary" id="gallery">ギャラリー</button></div>`}
else if(state.page==='gallery'){body=`<div class="eyebrow">COLLECTED MEMORIES</div><h1>みつやの思い出</h1><p class="copy">会話の結末にたどり着くたび、ひとつの景色が開きます。<br>暗い結末も、物語のひとつ。何度でもやり直せます。</p><div class="gallery">${Object.entries(endings).map(([k,e])=>`<div class="tile"><div class="${progress.unlocked.includes(k)?'':'locked'}">${rewardSvg(k)}</div><div class="tile-title">${progress.unlocked.includes(k)?e.name:'？？？ 未開放'}</div>${progress.unlocked.includes(k)?`<button class="btn secondary" style="margin-top:8px;padding:8px 14px;font-size:11px" data-save="${k}">画像保存</button>`:''}</div>`).join('')}</div><button class="btn" id="home">タイトルへ戻る</button>`}
 screen.innerHTML=portrait()+`<section class="content">${body}</section>`;bind();}
function replyFor(delta,i){const total=delta.reduce((a,b)=>a+b,0);let lines;if(total>=5)lines=['「……ありがとう。なんだか、言葉があたたかいね。」','「そう言ってもらえると、少し楽になる。」','「その返事、覚えていたいな。」'];else if(total>=2)lines=['「うん。そういう見方もあるんだね。」','「聞いてくれて、ありがとう。」','「……もう少し、話してもいい？」'];else if(total>=0)lines=['「そっか。少し考えてみるね。」','「うん、伝わったよ。」','「……そうなんだね。」'];else lines=['「……ごめん。少しだけ、言葉が見つからない。」','「今は、うまく返せないかもしれない。」','「ちょっと、距離を置いて考えたいな。」'];return lines[i%lines.length]}
function chooseEnd(){let [bond,safety,res]=state.stats,sum=bond+safety+res;if(sum<=-6||safety<=-7)return 'bad';if(sum>=30&&bond>=9&&safety>=10)return 'dawn';if(res>=12&&res>=safety-2)return 'resonance';if(safety>=13)return 'shelter';return 'normal'}
function rewardSvg(key){let e=endings[key];return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" role="img" aria-label="エンディング『${e.name}』の記念イラスト"><defs><linearGradient id="sky-${key}" x2="0" y2="1"><stop stop-color="${e.colors[0]}"/><stop offset="1" stop-color="${e.colors[1]}"/></linearGradient><radialGradient id="glow-${key}"><stop stop-color="#fffbe8" stop-opacity=".9"/><stop offset="1" stop-color="#fffbe8" stop-opacity="0"/></radialGradient></defs><rect width="620" height="390" fill="url(#sky-${key})"/><circle cx="465" cy="110" r="135" fill="url(#glow-${key})"/><circle cx="475" cy="100" r="${key==='bad'?27:40}" fill="#fff8df" opacity=".68"/><path d="M0 314 Q150 275 288 330 Q460 275 620 320 V390 H0" fill="${e.colors[2]}" opacity=".65"/><path d="M0 350 Q171 312 315 355 Q489 320 620 345 V390H0" fill="${e.colors[2]}" opacity=".7"/><g fill="none" stroke="#476c62" opacity=".35" stroke-width="3"><path d="M67 370 Q84 300 60 237M60 310Q20 281 29 245M79 292Q112 277 117 248M543 380Q519 318 553 230M536 308Q495 296 485 265M542 276Q584 260 585 236"/></g><g fill="${e.colors[2]}" opacity=".75"><ellipse cx="49" cy="265" rx="16" ry="34" transform="rotate(-39 49 265)"/><ellipse cx="98" cy="273" rx="15" ry="31" transform="rotate(42 98 273)"/><ellipse cx="505" cy="284" rx="15" ry="29" transform="rotate(-44 505 284)"/><ellipse cx="567" cy="259" rx="16" ry="29" transform="rotate(39 567 259)"/></g><g transform="translate(185 58)"><path d="M80 275 Q60 216 92 187 L158 185 Q195 217 176 275Z" fill="#7d9d88"/><path d="M110 189L127 225 146 188" fill="#fff8ee"/><ellipse cx="129" cy="133" rx="55" ry="68" fill="#efdbd0"/><path d="M75 137 Q56 54 122 40 Q192 30 187 135 L171 119 167 87 Q121 115 76 105Z" fill="#ecf1ed"/><path d="M70 111 Q91 63 155 65" fill="none" stroke="#ffffff" stroke-width="13" opacity=".72"/><path d="M95 135q10 -7 18 0 M145 135q10 -7 18 0" fill="none" stroke="#78958c" stroke-width="3"/><circle cx="105" cy="138" r="5" fill="#6b9a8f"/><circle cx="154" cy="138" r="5" fill="#6b9a8f"/><path d="M117 171 Q128 ${key==='bad'?169:181} 142 171" fill="none" stroke="#bd9691" stroke-width="2"/></g><g fill="#fff" opacity=".77"><circle cx="102" cy="84" r="2"/><circle cx="339" cy="51" r="2"/><circle cx="402" cy="132" r="1.6"/><circle cx="551" cy="178" r="2"/><text x="397" y="210" font-size="48" font-family="serif">${e.symbol}</text></g><text x="310" y="364" text-anchor="middle" font-size="12" letter-spacing="4" fill="#fefefb">MITSUYA · A QUIET MEMORY</text></svg>`}
function start(){state={page:'choose',index:0,stats:[0,0,0],choice:null,typed:'',mistakes:0,correct:0,started:Date.now(),elapsed:0,last:null};render()}

capeHTML(goal.slice(n+1))}</span>`;inp.value=next;document.querySelector('#feedback').textContent=raw!==next?'違う文字みたい。もう一度、ここから。':''})}}
